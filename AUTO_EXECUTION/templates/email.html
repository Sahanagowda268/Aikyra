{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="animate__animated animate__fadeInDown"><i class="fas fa-envelope me-2"></i>Email Composition</h2>
        <p class="lead animate__animated animate__fadeIn">Compose and send emails with AI-generated content</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="card animate__animated animate__fadeInUp">
            <div class="card-header">
                <h5><i class="fas fa-paper-plane me-2"></i>Compose Email</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="from_email" class="form-label">From Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="from_email" name="from_email" value="{{ from_email or '' }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="to_email" class="form-label">To Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="email" class="form-control" id="to_email" name="to_email" value="{{ to_email or '' }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-tag"></i></span>
                            <input type="text" class="form-control" id="subject" name="subject" value="{{ subject or '' }}" required>
                            <button type="submit" name="generate_body" value="true" class="btn btn-outline-secondary" id="generateBodyBtn">
                                <i class="fas fa-magic me-1"></i>Generate Body
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="body" class="form-label">Message Body</label>
                        <textarea class="form-control" id="body" name="body" rows="8" required>{{ body or '' }}</textarea>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="reset" class="btn btn-secondary me-md-2">
                            <i class="fas fa-times me-1"></i>Clear
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-1"></i>Send Email
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
